<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — PairWorkflows</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#042e1f;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;}
.navbar{background:#021a12;border-bottom:1px solid #0a4a30;padding:0 3rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:baseline;gap:1px;text-decoration:none;}
.logo-pair{font-size:18px;font-weight:800;color:#ffffff;letter-spacing:-.3px;}
.logo-workflows{font-size:18px;font-weight:400;color:#9fe1cb;letter-spacing:-.2px;}
.back-link{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.6);text-decoration:none;}
.back-link:hover{color:#ffffff;}
.search-wrap{max-width:860px;margin:2rem auto 5rem;padding:0 2rem;flex:1;width:100%;}
.search-box-wrap{position:relative;margin-bottom:2rem;}
.search-box{width:100%;padding:14px 50px 14px 18px;font-size:15px;font-family:'Inter',sans-serif;border:2px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.07);color:#ffffff;outline:none;}
.search-box:focus{border-color:#1d9e75;}
.search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);font-size:18px;}
.results-meta{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:1.25rem;min-height:20px;}
.results-meta span{color:#9fe1cb;font-weight:500;}
.results-grid{display:flex;flex-direction:column;gap:.875rem;}
.result-card{background:#ffffff;border-radius:12px;padding:1.25rem 1.5rem;text-decoration:none;display:flex;align-items:flex-start;gap:1rem;transition:all .15s;border:1px solid transparent;}
.result-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3);border-color:#1d9e75;}
.result-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.icon-claude{background:#fdf0ec;color:#b05030;}
.icon-gemini{background:#e6f1fb;color:#0c447c;}
.icon-resource{background:#e1f5ee;color:#085041;}
.icon-prompt{background:#ede9fe;color:#5b21b6;}
.result-title{font-size:15px;font-weight:600;color:#1a1a2e;margin-bottom:.4rem;}
.result-desc{font-size:13px;color:#6b7280;line-height:1.55;}
.site-footer{background:#021a12;padding:1.5rem 3rem;text-align:center;border-top:1px solid rgba(255,255,255,.06);margin-top:auto;}
</style>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="/index.html"><span class="logo-pair">Pair</span><span class="logo-workflows">Workflows</span></a>
  <a class="back-link" href="/index.html"><i class="ti ti-arrow-left"></i> Back to courses</a>
</nav>

<div class="search-wrap">
  <div class="search-box-wrap">
    <input type="text" class="search-box" id="searchInput" placeholder="Search for a topic, role, or keyword..." autocomplete="off">
    <i class="ti ti-search search-icon"></i>
  </div>
  <div class="results-meta" id="resultsMeta"></div>
  <div class="results-grid" id="resultsGrid"></div>
</div>

<footer class="site-footer"><div class="footer-copy">&copy; 2026 PairWorkflows. All rights reserved.</div></footer>

<script>
var searchData = [];
var isDataLoaded = false;

function renderResults(results, query) {
  var grid = document.getElementById('resultsGrid');
  var meta = document.getElementById('resultsMeta');
  
  if (results.length === 0) {
    meta.innerHTML = '';
    grid.innerHTML = '<div style="color:#fff;text-align:center;padding:2rem;">No results found.</div>';
    return;
  }
  
  meta.innerHTML = 'Found <span>' + results.length + ' result' + (results.length !== 1 ? 's' : '') + '</span>';
  
  // Prepariamo le parole chiave per l'evidenziazione
  var terms = query.toLowerCase().trim().split(/\s+/);
  // Usiamo una regex che ignora i caratteri speciali per evitare errori
  var pattern = terms.map(function(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
  var regex = new RegExp('(' + pattern + ')', 'gi');

  grid.innerHTML = results.map(function(item) {
    var iconCls = item.category.indexOf('Claude') > -1 ? 'icon-claude' : item.category.indexOf('Gemini') > -1 ? 'icon-gemini' : item.category.indexOf('Prompt') > -1 ? 'icon-prompt' : 'icon-resource';
    
    // Funzione sicura per evidenziare
    var highlight = function(text) {
      if (!text) return "";
      return text.replace(regex, function(match) {
        return '<mark style="background:#1d9e75; color:#fff; border-radius:2px;">' + match + '</mark>';
      });
    };

    return '<a href="' + item.url + '" class="result-card">' +
      '<div class="result-icon ' + iconCls + '"><i class="ti ti-file-text"></i></div>' +
      '<div class="result-body">' +
        '<div class="result-title">' + highlight(item.title) + '</div>' +
        '<div class="result-desc">' + highlight(item.description) + '</div>' +
      '</div>' +
      '</a>';
  }).join('');
}
function doSearch(query) {
  if (!isDataLoaded) {
    document.getElementById('resultsGrid').innerHTML = '<div style="color:#fff;text-align:center;padding:2rem;">Loading data... please wait.</div>';
    return;
  }
  
  if (!query || query.trim().length < 2) {
    document.getElementById('resultsMeta').innerHTML = '';
    document.getElementById('resultsGrid').innerHTML = '';
    return;
  }
  
  var terms = query.toLowerCase().trim().split(/\s+/);
  var results = searchData.filter(function(item) {
    var text = (item.title + ' ' + item.description + ' ' + item.tags.join(' ')).toLowerCase();
    return terms.every(function(t) { return text.indexOf(t) !== -1; });
  });
  
  // Qui passiamo sia i risultati che la query originale
  renderResults(results, query);
}

fetch('/search-index.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    searchData = data;
    isDataLoaded = true;
    
    var input = document.getElementById('searchInput');
    input.addEventListener('input', function() { doSearch(this.value); });
    
    // Se c'è una query nell'URL, cercala subito
    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q) {
      input.value = q;
      doSearch(q);
    }
  });
</script>
</body>
</html>
