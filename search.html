<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — PairWorkflows</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/global-fix.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#ffffff;color:#2e3333;min-height:100vh;display:flex;flex-direction:column;}

/* Navbar pulita e coerente */
.navbar{background:#021a12;border-bottom:1px solid #0a4a30;padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:baseline;gap:1px;text-decoration:none;}
.logo-pair{font-size:18px;font-weight:800;color:#ffffff;letter-spacing:-.3px;}
.logo-workflows{font-size:18px;font-weight:400;color:#9fe1cb;letter-spacing:-.2px;}
.back-link{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:500;}
.back-link:hover{color:#ffffff;}

/* Contenitore di ricerca */
.search-wrap{max-width:860px;margin:3rem auto 5rem;padding:0 2rem;flex:1;width:100%;}
.search-box-wrap{position:relative;margin-bottom:1.5rem;}
.search-box{width:100%;padding:16px 50px 16px 20px;font-size:16px;font-family:'Inter',sans-serif;border:2px solid #e8e8e8;border-radius:12px;background:#f8f9fa;color:#2e3333;outline:none;transition:all .2s;}
.search-box:focus{border-color:#1b966c;background:#ffffff;box-shadow:0 4px 12px rgba(27,150,108,0.08);}
.search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#696969;font-size:20px;}

.results-meta{font-size:13.5px;color:#696969;margin-bottom:1.5rem;min-height:24px;font-weight:500;}
.results-meta span{color:#1b966c;font-weight:600;}

.results-grid{display:flex;flex-direction:column;gap:12px;}
.result-card{background:#ffffff;border-radius:12px;padding:1.25rem 1.5rem;text-decoration:none;display:flex;align-items:flex-start;gap:1rem;transition:all .15s;border:1px solid #e8e8e8;box-shadow:0 2px 6px rgba(0,0,0,0.02);}
.result-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08);border-color:#1b966c;}

.result-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.icon-claude{background:#fdf0ec;color:#b05030;}
.icon-gemini{background:#e6f1fb;color:#0c447c;}
.icon-resource{background:#e1f5ee;color:#085041;}
.icon-prompt{background:#ede9fe;color:#5b21b6;}

.result-title{font-size:15px;font-weight:600;color:#2e3333;margin-bottom:4px;}
.result-desc{font-size:13.5px;color:#696969;line-height:1.5;}

.search-message{color:#696969;text-align:center;padding:3rem;font-size:14px;background:#f8f9fa;border-radius:12px;border:1px dashed #e8e8e8;}
</style>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="/index.html"><span class="logo-pair">Pair</span><span class="logo-workflows">Workflows</span></a>
  <a class="back-link" href="/index.html"><i class="ti ti-arrow-left"></i> Back to courses</a>
</nav>

<div class="search-wrap">
  <div class="search-box-wrap">
    <input type="text" class="search-box" id="searchInput" placeholder="Search for a topic, role, or keyword..." autocomplete="off">
    <i class="ti ti-search search-icon"></i>
  </div>
  <div class="results-meta" id="resultsMeta"></div>
  <div class="results-grid" id="resultsGrid"></div>
</div>

<script>
var searchData=[];
var isDataLoaded=false;
var STOPWORDS={'for':1,'the':1,'a':1,'an':1,'and':1,'or':1,'to':1,'in':1,'of':1,'is':1,'it':1,'at':1,'on':1,'how':1,'what':1,'with':1,'your':1,'you':1,'that':1,'this':1,'are':1,'can':1,'do':1,'by':1};

function scoreItem(item,terms){
  var titleLow=item.title.toLowerCase();
  var descLow=item.description.toLowerCase();
  var tagsLow=item.tags.join(' ').toLowerCase();
  var catLow=item.category.toLowerCase();
  var score=0;
  terms.forEach(function(t){
    if(t.length<2)return;
    if(titleLow.indexOf(t)!==-1)score+=10;
    if(tagsLow.indexOf(t)!==-1)score+=6;
    if(descLow.indexOf(t)!==-1)score+=3;
    if(catLow.indexOf(t)!==-1)score+=2;
  });
  var significantTerms=terms.filter(function(t){return t.length>=3&&!STOPWORDS[t];});
  if(significantTerms.length>0){
    var matched=significantTerms.filter(function(t){
      var full=titleLow+' '+tagsLow+' '+descLow;
      return full.indexOf(t)!==-1;
    });
    if(matched.length>=Math.ceil(significantTerms.length/2))score+=5;
  }
  return score;
}

function renderResults(results,query){
  var grid=document.getElementById('resultsGrid');
  var meta=document.getElementById('resultsMeta');
  if(results.length===0){
    meta.innerHTML='';
    grid.innerHTML='<div class="search-message">No results found. Try a different keyword.</div>';
    return;
  }
  meta.innerHTML='Found <span>'+results.length+' result'+(results.length!==1?'s':'')+'</span>';
  var terms=query.toLowerCase().trim().split(/\s+/).filter(function(t){return t.length>=2;});
  var pattern=terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
  var regex=new RegExp('('+pattern+')','gi');
  var highlight=function(text){
    if(!text)return'';
    return text.replace(regex,function(match){
      return'<mark style="background:#e1f5ee;color:#085041;border-radius:2px;padding:0 2px;font-weight:600;">'+match+'</mark>';
    });
  };
  grid.innerHTML=results.map(function(item){
    var iconCls=item.category.indexOf('Claude')>-1?'icon-claude':item.category.indexOf('Gemini')>-1?'icon-gemini':item.category.indexOf('Prompt')>-1?'icon-prompt':'icon-resource';
    return'<a href="'+item.url+'" class="result-card">'+
      '<div class="result-icon '+iconCls+'"><i class="ti ti-file-text"></i></div>'+
      '<div class="result-body">'+
        '<div class="result-title">'+highlight(item.title)+'</div>'+
        '<div class="result-desc">'+highlight(item.description)+'</div>'+
      '</div>'+
      '</a>';
  }).join('');
}

function doSearch(query){
  if(!isDataLoaded){
    document.getElementById('resultsGrid').innerHTML='<div class="search-message">Loading search index... please wait.</div>';
    return;
  }
  if(!query||query.trim().length<2){
    document.getElementById('resultsMeta').innerHTML='';
    document.getElementById('resultsGrid').innerHTML='';
    return;
  }
  var terms=query.toLowerCase().trim().split(/\s+/);
  var scored=searchData.map(function(item){return{item:item,score:scoreItem(item,terms)};});
  var results=scored.filter(function(s){return s.score>0;}).sort(function(a,b){return b.score-a.score;}).map(function(s){return s.item;});
  renderResults(results,query);
}

fetch('/search-index.json')
  .then(function(r){return r.json();})
  .then(function(data){
    searchData=data;
    isDataLoaded=true;
    var input=document.getElementById('searchInput');
    input.addEventListener('input',function(){doSearch(this.value);});
    var params=new URLSearchParams(window.location.search);
    var q=params.get('q');
    if(q){input.value=q;doSearch(q);}
  })
  .catch(function(){
    document.getElementById('resultsGrid').innerHTML='<div class="search-message" style="color:#b91c1c;">Could not load search data. Please check if search-index.json is available.</div>';
  });
</script>
</body>
</html>
