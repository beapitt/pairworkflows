<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Library for Corporate Professionals — PairWorkflows</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #042e1f; color: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; }
  .navbar { background: #021a12; border-bottom: 1px solid #0a4a30; padding: 0 3rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: baseline; gap: 1px; text-decoration: none; }
  .logo-pair { font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -.3px; }
  .logo-workflows { font-size: 18px; font-weight: 400; color: #9fe1cb; letter-spacing: -.2px; }
  .back-link { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.6); text-decoration: none; }
  .course-wrap { max-width: 1280px; margin: 0 auto; padding: 2rem 3rem 4rem; flex: 1; width: 100%; }
  .course-shell { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 40px rgba(0,0,0,.4); overflow: hidden; display: grid; grid-template-columns: 260px 1fr; min-height: 600px; }
  .sidebar { background: #f8fafb; border-right: 1px solid #e8ecef; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: .7rem 1.25rem; cursor: pointer; border-left: 3px solid transparent; }
  .nav-item.active { border-left-color: #1d9e75; background: #ffffff; }
  .nav-dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6b7280; }
  .nav-dot.done { background: #1d9e75; border-color: #1d9e75; color: #ffffff; }
  .nav-dot.active { border-color: #1d9e75; color: #0f6e56; font-weight: 600; }
  .content-area { display: flex; flex-direction: column; }
  .section-hero { background: linear-gradient(135deg, #085041 0%, #0f6e56 45%, #185fa5 100%); padding: 2rem 2.5rem; }
  .content-body { padding: 2rem 2.5rem; }
  .seo-section { display: none; }
  .seo-section.active-section { display: block; }
  .prompt-card { background: #f8fafb; border: 1px solid #e8ecef; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; border-left: 3px solid #1d9e75; }
  .prompt-badge { font-size: 9px; font-weight: 600; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
  .badge-writing { background: #e1f5ee; color: #085041; border: 1px solid #a7e8ce; }
  .badge-research { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
  .badge-strategy { background: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; }
  .badge-comms { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .prompt-text { font-family: monospace; font-size: 12.5px; background: #ffffff; padding: 10px; border: 1px solid #e8ecef; border-radius: 8px; margin: 10px 0; white-space: pre-wrap; }
  .copy-btn { background: #1d9e75; color: #ffffff; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<nav class="navbar"><a class="logo" href="/">PairWorkflows</a></nav>
<div class="course-wrap">
  <div class="course-shell">
    <div class="sidebar">
      <div class="nav-list" id="navList">
        <div class="nav-item active" id="ni0" onclick="go(0)"><div class="nav-dot" id="nd0">1</div><div>Manager</div></div>
        <div class="nav-item" id="ni1" onclick="go(1)"><div class="nav-dot" id="nd1">2</div><div>HR</div></div>
        <div class="nav-item" id="ni2" onclick="go(2)"><div class="nav-dot" id="nd2">3</div><div>Finance</div></div>
        <div class="nav-item" id="ni3" onclick="go(3)"><div class="nav-dot" id="nd3">4</div><div>Legal</div></div>
        <div class="nav-item" id="ni4" onclick="go(4)"><div class="nav-dot" id="nd4">5</div><div>Marketing</div></div>
        <div class="nav-item" id="ni5" onclick="go(5)"><div class="nav-dot" id="nd5">6</div><div>Operations</div></div>
        <div class="nav-item" id="ni6" onclick="go(6)"><div class="nav-dot" id="nd6">7</div><div>Sales</div></div>
        <div class="nav-item" id="ni7" onclick="go(7)"><div class="nav-dot" id="nd7">8</div><div>Project Management</div></div>
      </div>
    </div>
    <div class="content-area">
      <div class="section-hero">
        <h2 id="heroTitle">Manager</h2>
      </div>
      <div class="content-body" id="cnt">
        <div id="seo-sec-0" class="seo-section active-section">
          </div>
        </div>
      <div style="padding: 1rem; border-top: 1px solid #eee; display: flex; gap: 10px;">
        <button id="btnBack" onclick="go(cur-1)">Back</button>
        <button id="btnFwd" onclick="go(cur+1)">Next</button>
      </div>
    </div>
  </div>
</div>
<script>
var cur = 0; var TOTAL = 8; var visited = [true,false,false,false,false,false,false,false];
function go(n){ if(n<0||n>=TOTAL)return; visited[n]=true; cur=n; render(); window.scrollTo(0,0); }
function render(){
  for(var i=0;i<TOTAL;i++){
    document.getElementById('ni'+i).className = 'nav-item' + (i===cur ? ' active' : '');
    var sec = document.getElementById('seo-sec-'+i);
    if(sec) sec.className = 'seo-section' + (i===cur ? ' active-section' : '');
    var nd = document.getElementById('nd'+i);
    if(visited[i] && i!==cur){ nd.className='nav-dot done'; nd.innerHTML='<i class="ti ti-check"></i>'; }
    else if(i===cur){ nd.className='nav-dot active'; nd.textContent=(i+1); }
    else { nd.className='nav-dot'; nd.textContent=(i+1); }
  }
  document.getElementById('btnBack').disabled = (cur === 0);
  document.getElementById('btnFwd').style.display = (cur === TOTAL-1) ? 'none' : '';
}
function copyPrompt(id,btn){
  var text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    var orig=btn.innerHTML; btn.textContent='Copied!';
    setTimeout(()=>{btn.innerHTML=orig;},2000);
  });
}
render();
</script>
</body>
</html>
